version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: mess_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Khushi@123
      MYSQL_DATABASE: mess_management_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mess-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mess_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/mess_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Khushi@123
      JWT_SECRET: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
      WHATSAPP_ENABLED: "false"
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - mess-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mess_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mess-network

  adminer:
    image: adminer:latest
    container_name: mess_adminer
    ports:
      - "8081:8080"
    networks:
      - mess-network

volumes:
  mysql_data:

networks:
  mess-network:
    driver: bridge
